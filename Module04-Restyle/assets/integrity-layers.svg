<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc">
<title id="title">Three layers of data integrity</title><desc id="desc">Rules from setup.sql and rejected examples from verification.txt.</desc>
<rect width="1200" height="405" rx="16" fill="#0b1420"/>
<text x="40" y="45" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="27" font-weight="700">Three layers of data integrity</text>
<text x="40" y="78" fill="#94a3b8" font-family="Arial,sans-serif" font-size="16">Rules from setup.sql and rejected examples from verification.txt.</text>
<rect x="35" y="115" width="365" height="210" rx="8" fill="#101e2e" stroke="#31516a"/>
<text x="55" y="150" fill="#5eead4" font-family="Arial,sans-serif" font-size="19" font-weight="700">01 / ENTITY</text>
<text x="55" y="192" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17" font-weight="700">PRIMARY KEY + UNIQUE</text>
<text x="55" y="238" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Duplicate identity rejected</text>
<text x="55" y="285" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">machine_id + metric is unique</text>
<rect x="425" y="115" width="365" height="210" rx="8" fill="#101e2e" stroke="#31516a"/>
<text x="445" y="150" fill="#5eead4" font-family="Arial,sans-serif" font-size="19" font-weight="700">02 / REFERENTIAL</text>
<text x="445" y="192" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17" font-weight="700">FOREIGN KEY</text>
<text x="445" y="238" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">Missing sensor 99 rejected</text>
<text x="445" y="285" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">PRAGMA foreign_keys = ON</text>
<rect x="815" y="115" width="365" height="210" rx="8" fill="#101e2e" stroke="#31516a"/>
<text x="835" y="150" fill="#5eead4" font-family="Arial,sans-serif" font-size="19" font-weight="700">03 / DOMAIN</text>
<text x="835" y="192" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="17" font-weight="700">NOT NULL + CHECK + STRICT</text>
<text x="835" y="238" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">9000 and hot rejected</text>
<text x="835" y="285" fill="#94a3b8" font-family="Arial,sans-serif" font-size="15">Allowed range, required fields, types</text>
<text x="40" y="370" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="17">CHECK alone can accept NULL. STRICT can convert lossless numeric text such as 42.0.</text>
</svg>
