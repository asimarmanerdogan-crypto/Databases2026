<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">Telemetry workflow</title>
  <desc id="desc">Generate readings, load local SQLite, query and measure, then independently verify.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="none" stroke="#5eead4" stroke-width="1.5"/></marker></defs>
  <rect width="1200" height="150" rx="12" fill="#0b1827"/>
  <g fill="#102a3c" stroke="#2d6075"><rect x="20" y="26" width="260" height="98" rx="8"/><rect x="320" y="26" width="260" height="98" rx="8"/><rect x="620" y="26" width="260" height="98" rx="8"/><rect x="920" y="26" width="260" height="98" rx="8"/></g>
  <g stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"><path d="M287 75h23"/><path d="M587 75h23"/><path d="M887 75h23"/></g>
  <g font-family="monospace" font-size="13" fill="#5eead4"><text x="40" y="52">01 / GENERATE</text><text x="340" y="52">02 / LOAD</text><text x="640" y="52">03 / QUERY</text><text x="940" y="52">04 / VERIFY</text></g>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9"><text x="40" y="88">Simulated readings</text><text x="340" y="88">Local SQLite</text><text x="640" y="88">Measure results</text><text x="940" y="88">Independent checks</text></g>
</svg>
