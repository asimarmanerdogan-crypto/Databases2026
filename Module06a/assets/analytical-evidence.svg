<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="482" viewBox="0 0 1200 482" role="img" aria-labelledby="title desc">
  <title id="title">Analytical workflow and aggregate timings</title><desc id="desc">Module 5 rows expand to two million rows. Dashboard median: SQLite 1579.25 ms, DuckDB 14.23 ms. Monthly median: SQLite 1490.58 ms, DuckDB 45.76 ms.</desc>
  <rect width="1200" height="482" rx="18" fill="#0b1a2a"/>
  <style>text{font-family:Arial,sans-serif;fill:#e2e8f0}.title{font-size:30px;font-weight:700}.label{font-size:21px;font-weight:700}.detail{font-size:17px;fill:#94a3b8}.value{font-size:19px;font-weight:700}.accent{fill:#5eead4}.blue{fill:#38bdf8}.panel{fill:#0f2638;stroke:#28445c;stroke-width:1.5}.axis{stroke:#416078;stroke-width:1.5}</style>
  <text x="40" y="54" class="title">Build and compare the reporting copy</text>
  <rect x="40" y="76" width="265" height="90" rx="8" class="panel"/><text x="56" y="110" class="label">Module 5 history</text><text x="56" y="140" class="detail">200,000 source rows</text><path d="M307 121h13m-5-5 5 5-5 5" fill="none" stroke="#5eead4" stroke-width="2"/>
  <rect x="325" y="76" width="265" height="90" rx="8" class="panel"/><text x="341" y="110" class="label">Expand history</text><text x="341" y="140" class="detail">Ten 91-day offsets</text><path d="M592 121h13m-5-5 5 5-5 5" fill="none" stroke="#5eead4" stroke-width="2"/>
  <rect x="610" y="76" width="265" height="90" rx="8" class="panel"/><text x="626" y="110" class="label">Verify both copies</text><text x="626" y="140" class="detail">2,000,000 rows each</text><path d="M877 121h13m-5-5 5 5-5 5" fill="none" stroke="#5eead4" stroke-width="2"/>
  <rect x="895" y="76" width="265" height="90" rx="8" class="panel"/><text x="911" y="110" class="label">Time both engines</text><text x="911" y="140" class="detail">Five runs per query</text>
  <text x="40" y="218" class="title">Aggregate latency</text><text x="40" y="249" class="detail">Median of five measured runs · milliseconds · linear scale to 1,600 ms</text>
  <rect x="732" y="205" width="158" height="37" rx="8" class="panel"/><text x="749" y="230" class="value blue">■  SQLite</text><rect x="905" y="205" width="165" height="37" rx="8" class="panel"/><text x="922" y="230" class="value accent">■  DuckDB</text>
  <text x="40" y="310" class="label">Dashboard</text><rect x="225" y="280" width="730.40" height="16" rx="3" class="blue"/><rect x="225" y="307" width="6.58" height="16" rx="3" class="accent"/><text x="980" y="295" class="value">1,579.25 ms</text><text x="980" y="322" class="value">14.23 ms</text>
  <text x="40" y="392" class="label">Monthly report</text><rect x="225" y="362" width="689.39" height="16" rx="3" class="blue"/><rect x="225" y="389" width="21.16" height="16" rx="3" class="accent"/><text x="980" y="377" class="value">1,490.58 ms</text><text x="980" y="404" class="value">45.76 ms</text>
  <path d="M225 427h740" class="axis"/><text x="217" y="453" class="detail">0</text><text x="402" y="453" class="detail">400</text><text x="587" y="453" class="detail">800</text><text x="772" y="453" class="detail">1200</text><text x="957" y="453" class="detail">1600</text>
</svg>
