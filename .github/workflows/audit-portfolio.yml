name: Audit portfolio duplicates
on:
  push:
    branches: [audit-portfolio-duplicates]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare original and restyled files
        run: |
          python3 - <<'PY'
          from difflib import SequenceMatcher, unified_diff
          from pathlib import Path
          import os, re, subprocess

          paths = [Path(p) for p in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0') if p]
          old_roots = {f'Module{i:02}' for i in range(1, 5)}
          references = {}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              def say(s=''):
                  print(s, file=out)
              say('## References to originals in retained files')
              say('~~~~text')
              for p in paths:
                  if p.parts[0] in old_roots or p.stat().st_size > 250000:
                      continue
                  try:
                      data = p.read_text()
                  except UnicodeError:
                      continue
                  for i, line in enumerate(data.splitlines(), 1):
                      if re.search(r'Module0[1-4](?![-0-9])', line):
                          say(f'{p}:{i} {line[:215]}')
              say('~~~~')
              say('## Original files without a Restyle counterpart')
              for p in paths:
                  if p.parts[0] in old_roots:
                      dest = Path(p.parts[0] + '-Restyle', *p.parts[1:])
                      if not dest.is_file():
                          say(str(p))
              for base in sorted(old_roots):
                  say(f'## {base}: non-identical counterparts')
                  for p in paths:
                      if p.parts[0] != base:
                          continue
                      dest = Path(base + '-Restyle', *p.parts[1:])
                      if not dest.is_file() or p.read_bytes() == dest.read_bytes():
                          continue
                      say(f'### {p.name}')
                      say('~~~~text')
                      before = p.read_text(errors='replace').splitlines()
                      after = dest.read_text(errors='replace').splitlines()
                      if p.suffix != '.md':
                          say('\n'.join(unified_diff(before, after, n=0))[:7000])
                      else:
                          norm = lambda s: re.sub(r'[^a-z0-9]+',' ',s.lower()).strip()
                          norm_after = [norm(s) for s in after]
                          for s in before:
                              n = norm(s)
                              if len(n) < 14 or n in norm_after:
                                  continue
                              score = max((SequenceMatcher(None, n, item).ratio() for item in norm_after if 0.45 * len(n) < len(item) < 2.2 * len(n)), default=0)
                              if score < 0.68:
                                  say(s[:450])
                      say('~~~~')
          PY
