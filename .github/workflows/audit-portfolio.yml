name: Audit portfolio duplicates
on:
  push:
    branches: [audit-portfolio-duplicates]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate-portfolio
          fetch-depth: 0
          persist-credentials: false
      - name: Review staged changes and links
        run: |
          git rev-parse --short HEAD
          git diff --check origin/main...HEAD
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re, subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True)

          paths = {Path(p) for p in git('ls-files').splitlines()}
          changes = [line.split('\t') for line in git('diff', '--name-status', '--no-renames', 'origin/main...HEAD').splitlines()]
          removed = Counter(Path(name).parts[0] for flag, name in changes if flag == 'D')
          assert removed == {'Module01': 17, 'Module02': 14, 'Module03': 21, 'Module04': 12}, removed
          for flag, name in changes:
              path = Path(name)
              if flag == 'D':
                  reference = Path(path.parts[0] + '-Restyle', *path.parts[1:])
                  assert reference in paths, (path, reference)
              elif flag == 'M':
                  text = path.read_text()
                  assert not re.search(r'\bModule0[1-4]/', text), path
                  if path.suffix == '.md':
                      for target in re.findall(r'\]\(([^ )]+)', text):
                          if 'Module0' in target and not ('://' in target or target.startswith('#')):
                              assert (path.parent / target.split('#', 1)[0]).exists(), (path, target)
              else:
                  raise AssertionError((flag, name))
          print('Verified', sum(removed.values()), 'removed copies with retained counterparts, and', len(changes)-sum(removed.values()), 'updated files.')
          PY
      - name: Install uv
        run: python3 -m pip install uv
      - name: Reproduce Module 1 to 3 evidence
        run: uv run --locked python reproduce.py
      - name: Reproduce Module 4 verification
        run: uv run --locked python Module04-Restyle/verify_module04.py
