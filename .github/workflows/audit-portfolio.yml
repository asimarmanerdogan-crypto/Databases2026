name: Audit portfolio duplicates
on:
  push:
    branches: [audit-portfolio-duplicates]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare original and restyled files
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          from difflib import SequenceMatcher
          from hashlib import sha256
          from pathlib import Path
          import re, subprocess

          paths = [Path(p) for p in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0') if p]
          hashes = defaultdict(list)
          for p in paths:
              if p.is_file():
                  hashes[sha256(p.read_bytes()).digest()].append(str(p))
          for files in hashes.values():
              if len(files) > 1:
                  print('EXACT', ' | '.join(files))
          for i in range(1, 5):
              base = Path(f'Module{i:02}')
              style = Path(f'{base}-Restyle')
              orig = {str(p.relative_to(base)): p for p in paths if base in p.parents}
              new = {str(p.relative_to(style)): p for p in paths if style in p.parents}
              print('PAIR', str(base), len(orig), len(new))
              for name, old in sorted(orig.items()):
                  if name not in new:
                      print('ORIGINAL_ONLY', old, old.stat().st_size)
                  elif old.read_bytes() != new[name].read_bytes():
                      left = old.read_text(errors='replace').splitlines()
                      right = new[name].read_text(errors='replace').splitlines()
                      ratio = SequenceMatcher(None, left, right, autojunk=False).ratio()
                      print('CHANGED', old, 'vs', new[name], f'{len(left)}/{len(right)} lines', f'{ratio:.2f} similarity')
          print('REFERENCE PATHS')
          for p in paths:
              if p.suffix not in {'.md', '.py', '.toml', '.json', '.yml', '.txt', '.sql'} and p.name != '.gitignore':
                  continue
              if not p.is_file() or p.stat().st_size > 250000:
                  continue
              for n, line in enumerate(p.read_text(errors='replace').splitlines(), 1):
                  if re.search(r'Module0[1-4](?![0-9])', line):
                      print('REF', f'{p}:{n}', line[:260])
          PY
