<text x="98" y="150" text-anchor="start" fill="#5eead4" font-family="Arial,sans-serif" font-size="17">ARTIST</text>
<text x="98" y="192" text-anchor="start" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="15">artist_id</text>
<text x="402" y="192" text-anchor="end" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">int PK</text>
<text x="98" y="222" text-anchor="start" fill="#e2e8f0" font-family="Arial,sans-serif" font-size="15">artist_name</text>
<text x="402" y="222" text-anchor="end" fill="#94a3b8" font-family="Arial,sans-serif" font-size="12">string</text>
