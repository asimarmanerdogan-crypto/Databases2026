<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">SQLite JSON plans and session timings</title><desc id="desc">Both JSON predicates return 334 Fanuc devices. The exact json_extract expression uses the index. The shorthand scans the table. For 20,000 keys, shelve writes 13.4312 s and reads 2.8640 s. SQLite writes 0.0536 s and reads 2.9859 s.</desc>
  <rect width="1200" height="520" rx="18" fill="#0b1a2a"/>
  <style>text{font-family:Arial,sans-serif;fill:#e2e8f0}.title{font-size:30px;font-weight:700}.label{font-size:21px;font-weight:700}.detail{font-size:17px;fill:#94a3b8}.value{font-size:19px;font-weight:700}.accent{fill:#5eead4}.blue{fill:#38bdf8}.panel{fill:#0f2638;stroke:#28445c;stroke-width:1.5}.axis{stroke:#416078;stroke-width:1.5}</style>
  <text x="40" y="55" class="title">Same JSON results, different query plans</text><text x="40" y="87" class="detail">Both predicates returned 334 Fanuc devices out of 1,000.</text>
  <rect x="40" y="109" width="550" height="95" rx="8" class="panel"/><text x="60" y="144" class="label">json_extract(meta, '$.vendor')</text><text x="60" y="180" class="value accent">SEARCH using ix_device_vendor</text>
  <rect x="610" y="109" width="550" height="95" rx="8" class="panel"/><text x="630" y="144" class="label">meta -&gt;&gt; 'vendor'</text><text x="630" y="180" class="value blue">SCAN device</text>
  <text x="40" y="263" class="title">Session benchmark</text><text x="40" y="293" class="detail">20,000 verified keys in each store · one Windows run · independent linear scales</text>
  <rect x="40" y="316" width="550" height="180" rx="8" class="panel"/><text x="58" y="348" class="label">Writes</text><text x="58" y="371" class="detail">0–14 seconds</text><text x="58" y="412" class="detail">shelve</text><text x="58" y="453" class="detail">SQLite</text><rect x="142" y="397" width="289.73" height="16" rx="3" class="blue"/><rect x="142" y="438" width="1.16" height="16" rx="3" class="accent"/><text x="457" y="412" class="value">13.4312 s</text><text x="457" y="453" class="value">0.0536 s</text><path d="M142 471h302" class="axis"/>
  <rect x="610" y="316" width="550" height="180" rx="8" class="panel"/><text x="628" y="348" class="label">Reads</text><text x="628" y="371" class="detail">0–3.2 seconds</text><text x="628" y="412" class="detail">shelve</text><text x="628" y="453" class="detail">SQLite</text><rect x="712" y="397" width="270.29" height="16" rx="3" class="blue"/><rect x="712" y="438" width="281.79" height="16" rx="3" class="accent"/><text x="1027" y="412" class="value">2.8640 s</text><text x="1027" y="453" class="value">2.9859 s</text><path d="M712 471h302" class="axis"/>
</svg>
